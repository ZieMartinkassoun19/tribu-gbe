<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ea580c">
<title>Tribu Gbê</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--bg2:#fff7ed;--tx:#1c1917;--tx2:#57534e;--card:#fff;--bd:#fed7aa;--ac:#ea580c;--sh:#9a3412;--dg:#dc2626}
body.dark{--bg:#14110f;--bg2:#211b16;--tx:#fff7ed;--tx2:#e7dccf;--card:#221d18;--bd:#4a3a2c;--ac:#ffa05a;--sh:#b45309;--dg:#ff8a8a}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui,sans-serif;background:#1c1917;color:var(--tx);display:flex;justify-content:center;align-items:center;min-height:100dvh}
.app{position:relative;width:100%;height:100dvh;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media(min-width:600px){body{padding:20px}.app{max-width:400px;height:780px;border-radius:32px;box-shadow:0 25px 50px -12px #0008}}
header{padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--bd);background:var(--bg)}
header img{width:40px;height:40px;border-radius:50%;box-shadow:0 3px 8px #0004}
.logo{flex:1;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1.4rem;letter-spacing:.06em;color:var(--ac);line-height:1}
.logo small{display:block;font:500 .58rem Inter;letter-spacing:.18em;color:var(--tx2);margin-top:2px}
.ib{width:40px!important;height:40px;padding:0!important;margin:0!important;border-radius:12px!important;display:flex;align-items:center;justify-content:center;font-size:1.1rem!important}
.burger span{display:block;width:18px;height:2px;background:var(--ac);border-radius:2px;transition:.3s;margin:2.5px 0}
.burger.x span:nth-child(1){transform:translateY(7px) rotate(45deg)}.burger.x span:nth-child(2){opacity:0}.burger.x span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
main{flex:1;overflow-y:auto;padding:16px}
nav{display:flex;border-top:1px solid var(--bd);padding:6px 4px calc(8px + env(safe-area-inset-bottom));background:var(--bg)}
nav button{flex:1;background:none;border:0;box-shadow:none!important;color:var(--tx2);font:500 .68rem Inter;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;margin:0;width:auto;transition:.2s}
nav button b{font-size:1.25rem;filter:grayscale(1);opacity:.7;transition:.25s}
nav button.on{color:var(--ac)}nav button.on b{filter:none;opacity:1;transform:translateY(-3px) scale(1.15)}
h2{font-family:'Barlow Condensed',sans-serif;font-size:1.6rem;letter-spacing:.02em;margin-bottom:12px}
h3{font-size:1rem;margin-bottom:8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 1px 0 #fff8 inset,0 6px 14px #0000001a,0 2px 0 var(--bd)}
.card.click{cursor:pointer;transition:.15s}.card.click:active{transform:scale(.98)}
.hero{background:linear-gradient(135deg,#c2410c,#7c2d12);color:#fff;border-radius:18px;padding:18px;margin-bottom:12px;box-shadow:0 8px 18px #ea580c55}
.hero h2{margin:0 0 4px;color:#fff}.hero p{color:#fff}
p{margin:4px 0;color:var(--tx2);font-size:.9rem;line-height:1.45}
button{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:12px;font:600 .9rem Inter;cursor:pointer;width:100%;margin-top:8px;box-shadow:0 4px 0 var(--sh),0 8px 12px #0002;transition:transform .08s,box-shadow .08s}
body.dark button{color:#1c1917}
button.sec{background:transparent;color:var(--ac);border:1.5px solid var(--ac);box-shadow:0 3px 0 var(--bd)}
button.dg{background:transparent;color:var(--dg);border:1.5px solid var(--dg);box-shadow:0 3px 0 var(--bd)}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sh)}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;margin-bottom:10px}
input[type=color]{height:44px;padding:3px}textarea{min-height:80px;resize:vertical}
label{display:block;font-size:.78rem;font-weight:600;color:var(--tx2);margin-bottom:4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.badge{display:inline-block;background:var(--bg2);color:var(--ac);border:1px solid var(--bd);border-radius:20px;padding:2px 9px;font-size:.7rem;font-weight:600}
.item{padding:11px 0;border-bottom:1px solid var(--bd);cursor:pointer}.item:last-child{border:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid button{margin:0}
.code{font-family:ui-monospace,monospace;background:var(--bg2);border:1px dashed var(--ac);border-radius:8px;padding:3px 8px;font-size:.85rem;color:var(--ac)}
.link{background:none;border:0;box-shadow:none!important;color:var(--ac);text-decoration:underline;width:auto;padding:4px;margin:0;font-weight:500}
.err{color:var(--dg);font-size:.82rem;min-height:1.1em;margin-bottom:6px}
#modal{position:absolute;inset:0;background:#000a;display:none;align-items:flex-end;z-index:20}
#modal .box{background:var(--bg);width:100%;border-radius:24px 24px 0 0;padding:20px;max-height:85%;overflow:auto}
#toast{position:absolute;left:16px;right:16px;bottom:84px;background:#1c1917f2;color:#fff;border-radius:14px;padding:12px 14px;font-size:.85rem;text-align:center;z-index:30;display:none}
/* Menu */
#drawer{position:absolute;inset:0;z-index:40;pointer-events:none}
#drawer .bk{position:absolute;inset:0;background:#0008;opacity:0;transition:.3s}
#drawer .pn{position:absolute;top:0;bottom:0;right:0;width:78%;background:var(--bg);padding:calc(70px + env(safe-area-inset-top)) 14px 14px;transform:translateX(105%);transition:transform .4s cubic-bezier(.2,.9,.3,1);overflow:auto;box-shadow:-10px 0 30px #0005}
#drawer.open{pointer-events:auto}#drawer.open .bk{opacity:1}#drawer.open .pn{transform:none}
#drawer .mi{display:block;text-align:left;margin:0 0 8px;opacity:0;transform:translateX(40px)}
#drawer.open .mi{animation:mi .45s calc(var(--i)*55ms + .15s) both}
@keyframes mi{to{opacity:1;transform:none}}
.burger{z-index:50;position:relative}
/* Splash */
#splash{position:absolute;inset:0;z-index:100;background:#0d0b09;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transition:opacity .2s}
#splash.gone{opacity:0;pointer-events:none}
#splash .gl{position:relative;width:min(62vw,240px);aspect-ratio:1;animation:pop .9s cubic-bezier(.2,1.4,.4,1) both}
#splash .gl img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;box-shadow:0 0 50px #ea580c88}
#splash .r,#splash .c{mix-blend-mode:screen;opacity:0}
#splash .r{filter:sepia(1) saturate(9) hue-rotate(-50deg)}#splash .c{filter:sepia(1) saturate(9) hue-rotate(150deg)}
#splash h1{font-family:'Barlow Condensed',sans-serif;font-size:2rem;letter-spacing:.1em;color:#fff;animation:fi 1s .4s both}
#splash p{color:#fdba74;letter-spacing:.25em;font-size:.7rem;animation:fi 1s .7s both}
#splash .bar{width:140px;height:3px;background:#fff2;border-radius:3px;overflow:hidden}
#splash .bar i{display:block;height:100%;background:var(--ac);animation:ld 1.7s linear both}
#splash.glitch .gl{animation:gl .8s steps(1) both}
#splash.glitch .r{opacity:.85;animation:gr .8s steps(1) both}#splash.glitch .c{opacity:.85;animation:gc .8s steps(1) both}
#splash.glitch h1{animation:gt .8s steps(1) both}
@keyframes pop{from{transform:scale(.3) rotate(-25deg);opacity:0}}
@keyframes fi{from{opacity:0;transform:translateY(10px)}}
@keyframes ld{from{width:0}to{width:100%}}
@keyframes gl{0%{transform:none}12%{transform:translate(-9px,2px) skewX(10deg);clip-path:inset(8% 0 58% 0)}24%{transform:translate(11px,-3px);clip-path:inset(62% 0 6% 0)}36%{transform:skewX(-12deg);clip-path:inset(0)}48%{transform:translate(7px,4px);clip-path:inset(32% 0 38% 0);filter:hue-rotate(90deg) contrast(1.6)}62%{transform:translate(-12px,0);clip-path:inset(0 0 70% 0)}76%{transform:scale(1.12);clip-path:inset(0);opacity:.6}90%{transform:scale(1.5,.03);opacity:1}100%{transform:scale(1.8,0);opacity:0}}
@keyframes gr{0%,100%{transform:translateX(0)}20%{transform:translateX(-14px)}50%{transform:translateX(12px)}75%{transform:translateX(-9px)}}
@keyframes gc{0%,100%{transform:translateX(0)}25%{transform:translateX(13px)}55%{transform:translateX(-12px)}80%{transform:translateX(9px)}}
@keyframes gt{0%,100%{transform:none}20%{transform:translateX(-8px);color:#0ff}45%{transform:translateX(9px) skewX(14deg);color:#f33}70%{transform:translateX(-4px);opacity:.3}}
/* Chapeau + fleur de lys */
.stage{position:relative;height:190px;width:220px;margin:46px auto 0}
.stage .hat{position:absolute;left:10px;top:30px;width:200px;transition:.8s}
.stage .fl{position:absolute;left:93px;top:52px;width:34px;height:48px;cursor:pointer;fill:#f5c542;stroke:#7a5a10;stroke-width:3;paint-order:stroke;overflow:visible;filter:drop-shadow(0 1px 2px #0006);transition:transform 1s,fill .8s,filter .8s;z-index:2;animation:pl 1.6s infinite}
.halo{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:radial-gradient(#fff3a0,#ffc83daa 45%,transparent 72%);opacity:0;transition:.9s;pointer-events:none}
.lit .hat{opacity:0;transform:translateY(-24px) scale(.7)}
.lit .fl{transform:translateY(19px) scale(2.5);fill:#ffe45c;stroke:#d97706;stroke-width:2.5;filter:drop-shadow(0 0 6px #fff) drop-shadow(0 0 16px #ffd54a) drop-shadow(0 0 34px #ffb300);animation:glow 2.2s .9s infinite alternate}
.lit .halo{opacity:1;width:230px;height:230px;margin:-115px 0 0 -115px}
.lit .hint{display:none}
.hint{text-align:center;font-size:.8rem;color:var(--tx2)}
@keyframes pl{50%{transform:scale(1.12)}}
@keyframes glow{to{filter:drop-shadow(0 0 10px #fff) drop-shadow(0 0 26px #ffd54a) drop-shadow(0 0 56px #ffb300)}}
#regf{opacity:0;pointer-events:none;transition:opacity 1.2s}#regf.on{opacity:1;pointer-events:auto}

/* Mode sombre lisible */
body.dark main,body.dark #modal .box,body.dark #drawer .pn{color:var(--tx)}
body.dark p,body.dark label,body.dark small,body.dark .hint{color:var(--tx2)}
body.dark h2,body.dark h3,body.dark strong{color:#fff}
body.dark input,body.dark select,body.dark textarea{background:#2c251f;color:#fff;border-color:#8a6a4f}
body.dark ::placeholder{color:#cdbfae;opacity:1}
body.dark .badge{background:#3b2d22;color:#ffd7b0;border-color:#8a6040}
body.dark button{color:#1a1109;font-weight:700}
body.dark button.sec,body.dark button.link{color:#ffb878;border-color:#ffb878}
body.dark button.dg{color:#ff9a9a;border-color:#ff9a9a}
body.dark nav button{color:#e7dccf}body.dark nav button.on{color:#ffa05a}
body.dark .code{background:#2c251f;color:#ffd7b0;border-color:#ffa05a}
body.dark .hero p,body.dark .hero h2{color:#fff}
body.dark .item{color:var(--tx)}
/* Carte de membre (960x640, mise à l'échelle) */
.cw{position:relative;width:100%;aspect-ratio:3/2;overflow:hidden;border-radius:10px;box-shadow:0 6px 18px #0003;margin-bottom:10px;background:#fdd5ab}
.idc{position:absolute;left:0;top:0;width:960px;height:640px;transform-origin:0 0;font-family:Montserrat,Inter,sans-serif;background:linear-gradient(180deg,#ffe0bd,#fdd0a2);color:#5a230a;overflow:hidden;text-align:left}
.idc *{box-sizing:border-box;margin:0}
.idc .pat{position:absolute;left:0;top:130px;width:960px;height:458px}
.idc .hd{position:absolute;left:0;top:0;width:960px;height:130px;background:#e5640c}
.idc .lg{position:absolute;left:49px;top:14px;width:108px;height:108px;border-radius:50%;border:4px solid #fff;outline:2px solid #fff;outline-offset:4px;overflow:hidden;background:#fff}
.idc .lg img{width:100%;height:100%;object-fit:cover;display:block}
.idc .vl{position:absolute;left:190px;width:290px;color:#fff}
.idc .vs{font-size:13px;font-weight:600;letter-spacing:3px;opacity:.9}
.idc .vn{font-size:26px;font-weight:800;letter-spacing:1px;white-space:nowrap}
.idc .gj{position:relative;margin-top:9px;height:30px;border:2px solid #fff;border-radius:16px;overflow:hidden;background:#b94e08}
.idc .gj i{position:absolute;left:0;top:0;bottom:0;right:0;background:linear-gradient(90deg,#ffd54a,#fff0a8,#ffd54a)}
.idc .gj b{position:relative;display:block;text-align:center;line-height:26px;font-size:15px;font-weight:800;color:#6b2406;letter-spacing:1px}
.idc .tt{position:absolute;right:30px;top:22px;text-align:right;color:#fff}
.idc .t1{font-size:60px;font-weight:800;line-height:1.05;letter-spacing:1px}
.idc .t2{font-size:26px;font-weight:400;letter-spacing:2px;color:#ffd8b6;margin-top:6px}
.idc .ft{position:absolute;left:0;top:588px;width:960px;height:52px;background:#e5640c;color:#fff;text-align:center;line-height:52px;font-size:26px;font-weight:500;letter-spacing:7px}
.idc .pf{position:absolute;left:57px;top:199px;width:242px;height:216px;border:5px solid #e0630f;border-radius:30px;overflow:hidden}
.idc .pf img{width:100%;height:100%;object-fit:cover;display:block}
.idc .pd{position:absolute;left:7px;top:7px;right:7px;bottom:7px;border:1.5px dashed #e0630f;border-radius:23px}
.idc .pi{position:absolute;left:0;right:0;top:48px;text-align:center}
.idc .pt{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-size:17px;font-weight:600;color:#8c3a0a}
.idc .cbar{position:absolute;left:61px;top:440px;width:234px;height:54px}
.idc .cid{position:absolute;left:57px;top:503px;width:242px;text-align:center;font-size:17px;font-weight:700;letter-spacing:1px;color:#8c3a0a;white-space:nowrap}
.idc .dv{position:absolute;left:331px;top:199px;width:3px;height:318px;background:#e0630f}
.idc .fd{position:absolute;left:369px;width:561px;height:36px;line-height:36px;font-size:21px;font-weight:500;color:#5a230a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idc .fd b{font-weight:700;color:#8c3a0a}
.idc .qb{position:absolute;left:806px;top:462px;width:104px;height:116px;background:#fff7ef;border:2.5px solid #e0630f;border-radius:14px;text-align:center}
.idc .cqr{position:absolute;left:12px;top:10px;width:76px;height:76px;background:#fff}
.cqr canvas,.cqr img{width:100%!important;height:100%!important;display:block}
.idc .ql{position:absolute;left:0;right:0;bottom:7px;font-size:11px;font-weight:700;color:#8c3a0a}

/* Améliorations v2 */
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{margin:0;padding:10px;font-size:.88rem}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.kpi div{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;text-align:center;box-shadow:0 2px 0 var(--bd)}.kpi b{display:block;font:700 1.7rem 'Barlow Condensed',sans-serif;color:var(--ac)}.kpi span{font-size:.75rem;color:var(--tx2);font-weight:600}
.bar{display:flex;height:24px;border-radius:8px;overflow:hidden;margin-top:6px;background:var(--bg2)}.bar i{display:flex;align-items:center;justify-content:center;color:#fff;font:600 .72rem Inter;font-style:normal;min-width:0}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.75rem;color:var(--tx2)}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}

/* Slogan */
#slg{position:absolute;inset:0;z-index:45;background:#000b;display:flex;align-items:center;justify-content:center;padding:14px;animation:slgIn .3s both}
@keyframes slgIn{from{opacity:0}to{opacity:1}}
#slg .sw{width:100%;max-height:100%;overflow-y:auto;border-radius:22px;perspective:900px;-webkit-overflow-scrolling:touch}
#slg .sc{transition:transform .28s ease;border-radius:22px;position:relative}
#slg .sc.fl{transform:rotateY(90deg)}
#slg .fr{background:linear-gradient(135deg,#c2410c,#7c2d12);color:#fff;padding:34px 20px 26px;text-align:center;box-shadow:0 8px 18px #ea580c55;cursor:pointer;border-radius:22px;animation:slgPop .6s both}
@keyframes slgPop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
#slg .fr .sl{font:700 1.55rem/1.3 'Barlow Condensed',sans-serif;letter-spacing:.04em;margin:8px 0 16px}
#slg .fr .th{font-size:.8rem;opacity:.9;animation:slgPulse 1.6s infinite}
@keyframes slgPulse{50%{opacity:.4}}
#slg .bk2{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:22px;padding:18px 16px 16px;box-shadow:0 8px 18px #0004}
#slg .bk2 h3{font:700 1.25rem 'Barlow Condensed',sans-serif;color:var(--ac);letter-spacing:.03em;margin:12px 0 6px}
#slg .bk2 h3:first-child{margin-top:0}
#slg .bk2 p{color:var(--tx);margin:6px 0}
#slg .od{display:flex;gap:8px;align-items:flex-start;margin:7px 0;padding:8px;border-radius:12px;background:var(--bg2);font-size:.85rem;color:var(--tx)}
#slg .od b{flex:none;min-width:58px;text-align:center;color:#fff;border-radius:8px;padding:3px 4px;font-size:.7rem}
#slg .cur::after{content:"▍";color:var(--ac);animation:slgPulse .7s infinite}
#slg .x{position:sticky;top:0;float:right;width:34px!important;height:34px;padding:0!important;margin:0 0 0 6px!important;border-radius:50%!important;z-index:2;font-size:.9rem}
</style>
</head>
<body>
<div class="app">
  <header><img data-l alt="Logo"><div class="logo">TRIBU GBÊ<small>FOI · DÉFI · UNITÉ</small></div>
    <button class="sec ib" data-act="theme" aria-label="Thème">◐</button><button class="sec ib burger" data-act="menu" aria-label="Menu"><div><span></span><span></span><span></span></div></button></header>
  <main id="main"></main>
  <nav>
    <button data-nav="home"><b>🏠</b>Accueil</button><button data-nav="ann"><b>📢</b>Annonces</button>
    <button data-nav="comm"><b>👥</b>Communauté</button><button data-nav="profile"><b>👤</b>Profil</button><button data-nav="set"><b>⚙️</b>Réglages</button>
  </nav>
  <div id="drawer"><div class="bk" data-act="menu"></div><div class="pn" id="dp"></div></div>
  <div id="modal"></div><div id="toast"></div>
  <div id="splash"><div class="gl"><img data-l alt=""><img data-l class="r" alt=""><img data-l class="c" alt=""></div><h1>TRIBU GBÊ</h1><p>FOI · DÉFI · UNITÉ</p><div class="bar"><i></i></div></div>
</div>
<input type="file" id="file" accept="application/json" hidden>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script>
"use strict";

/* ===== Utilitaires ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const fmtDate = d => d ? new Date(d + "T00:00").toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "long" }) : "";
const today = () => new Date().toISOString().slice(0, 10);
function toast(m, ms = 3500) { const t = $("#toast"); t.textContent = m; t.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = "none", ms); }
async function hash(pin, salt) {
  const b = new TextEncoder().encode(salt + ":" + pin);
  if (window.crypto && crypto.subtle) return [...new Uint8Array(await crypto.subtle.digest("SHA-256", b))].map(x => x.toString(16).padStart(2, "0")).join("");
  return btoa(salt + pin);
}
const normPhone = p => String(p).replace(/\D/g, "");
const age = b => { const d = new Date(b), n = new Date(); let a = n.getFullYear() - d.getFullYear(); if (n < new Date(n.getFullYear(), d.getMonth(), d.getDate())) a--; return a; };
let AC; function snd(f = 660, d = .12) { try { AC = AC || new (window.AudioContext || webkitAudioContext)(); const o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = f; g.gain.setValueAtTime(.15, AC.currentTime); g.gain.exponentialRampToValueAtTime(.001, AC.currentTime + d); o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + d); } catch (e) {} }
const chime = () => { snd(660); setTimeout(() => snd(880, .2), 110); };
const dl = (name, blob) => { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); };
const tint = (h, k = .78) => [1, 3, 5].map(i => Math.round(parseInt(h.substr(i, 2), 16) * (1 - k) + 255 * k));
const tintHex = h => "#" + tint(h).map(x => x.toString(16).padStart(2, "0")).join("");

/* ===== Données (base vierge, stockée sur l'appareil) ===== */
const VILLAGE_NAMES = ["GRANITE","ALBITES","AIGUILLES","QUARTZITES","AMPHIBOLITES"];
const VILLAGE_COLORS = ["#8b5e3c","#64748b","#0f766e","#7c3aed","#b45309"];
let S = { members: [], ann: [], posts: [], villages: [], codes: [], doc: { t: "", x: "" }, cur: null, voice: 0 };
try { Object.assign(S, JSON.parse(localStorage.getItem("cg_gbe") || "{}")); } catch (e) {}
function norm(){
  const oldV = S.villages || [], vm = {};
  S.villages = VILLAGE_NAMES.map((name,i) => { const o = oldV.find(v => String(v.name||"").toUpperCase() === name), id = o?.id || "village_"+i; oldV.forEach(v => { if(String(v.name||"").toUpperCase()===name) vm[v.id]=id; }); return {id, name, color:VILLAGE_COLORS[i]}; });
  S.members.forEach(m => { if(vm[m.vil]) m.vil = vm[m.vil]; if(!m.village && m.generation) m.village = m.generation; });
  S.codes.forEach(c => { if(!c.createdAt) c.createdAt = Date.now(); });
  S.trash = S.trash || []; S.doc = S.doc || {t:"",x:""};
}
norm();
const save = () => { try { localStorage.setItem("cg_gbe", JSON.stringify({doc:S.doc,trash:S.trash,voice:S.voice})); } catch (e) { toast("Enregistrement impossible (stockage plein ou bloqué)."); } };
const me = () => S.members.find(m => m.id === S.cur && m.active) || null;
const isFounder = () => me()?.role === "founder";
const isSafhouin = () => me()?.role === "safhouin";
const isSafouin = () => me()?.role === "safouin";
const isStaff = () => ["founder", "safhouin", "safouin"].includes(me()?.role);
const isS = () => isFounder() || isSafhouin();
const staff = () => isStaff();
const canEditMember = m => isFounder() || (isSafhouin() && m.role !== "founder") || (isSafouin() && m.vil === me()?.vil && m.role === "cheminot");
const canSeePhone = m => isFounder() || isSafhouin() || (isSafouin() && m.vil === me()?.vil) || me()?.id === m.id;
const canPromote = m => m.role === "cheminot" && m.active && (isFounder() || isSafhouin() || (isSafouin() && m.vil === me()?.vil));
const canDemote = m => m.role === "safouin" && (isFounder() || isSafhouin() || (isSafouin() && m.vil === me()?.vil));
const canDeleteMember = m => (isFounder() || isSafhouin()) && m.role !== "founder" && m.id !== me()?.id;
const canBlockMember = m => m.role !== "founder" && m.id !== me()?.id && (isFounder() || (isSafhouin() && m.role !== "safhouin") || (isSafouin() && m.vil === me()?.vil && m.role === "cheminot"));
const active = () => S.members.filter(m => m.active);
const vil = id => S.villages.find(v => v.id === id);
const nm = id => { const m=S.members.find(x=>x.id===id); return m ? displayName(m) : "?"; };
const displayName = m => m.role === "safouin" ? "Chef " + (m.surname || m.name.trim().split(/\s+/)[0]) : m.name;
const vb = m => { const v = vil(m.vil); return v ? `<span class="badge" style="background:${v.color};color:#fff;border-color:${v.color}">${esc(v.name)}</span>` : ""; };
const rb = m => `<span class="badge">${RL[m.role]}</span>`;

/* ===== Navigation ===== */
let T = "home", P = null, hist = [], regLit = false;
const PARENT = { annDetail: "ann", auth: "profile", reg: "profile" }, NAVS = ["home", "ann", "comm", "profile", "set"];
function go(t, p, isBack) { if (!isBack && (t !== T || p !== P)) hist.push([T, P]); if (t === "reg" && T !== "reg") regLit = false; T = t; P = p; render(); $("#main").scrollTop = 0; }
function back() { const h = hist.pop() || ["home", null]; go(h[0], h[1], true); }
function render() {
  $("#main").innerHTML = (V[T] || V.home)();
  const root = PARENT[T] || (NAVS.includes(T) ? T : "home");
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.nav === root));
  afterRender();
}
const backBtn = () => `<button class="sec" data-act="back">← Retour</button>`;

const upcoming = all => [...S.ann].filter(a => all || a.date >= today()).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));

  /* Statistiques */
  const GC = {M:"#2563eb",F:"#db2777",N:"#9ca3af"};
  function statsData() {
    const tally = () => ({M:0,F:0,N:0,t:0});
    const add = (o, m) => { if (!o) return; o[m.gender === "M" || m.gender === "F" ? m.gender : "N"]++; o.t++; };
    const r = {
      cheminot:tally(), routier:tally(), jeune:tally(),
      founder:tally(), safhouin:tally(), safouin:tally(), byVil:{}
    };
    S.villages.forEach(v => r.byVil[v.id] = {cheminot:tally(),routier:tally(),jeune:tally()});
    [...S.members.filter(m => m.active), ...(S.managed || [])].forEach(m => {
      if (m.role === "founder") { add(r.founder, m); return; }
      if (m.role === "safhouin") { add(r.safhouin, m); return; }
      if (m.role === "safouin") { add(r.safouin, m); return; }
      const u = unitOf(m);
      if (!r[u]) return;
      add(r[u], m);
      const b = r.byVil[m.vil];
      if (b && b[u]) add(b[u], m);
    });
    return r;

    if(m.id===S.cur&&m.role==="cheminot"&&!m.editAllowed)return toast("Demandez à votre Safouin d'autoriser la modification du profil.");
    if(m.id!==S.cur&&!staff())return toast("Action réservée aux Safouins.");
    const fields=[{k:"name",l:"Nom et prénoms",v:m.name},{k:"birth",l:"Date de naissance",v:m.birth,t:"date"},{k:"school",l:"École",v:m.school},{k:"classe",l:"Classe",v:m.classe},{k:"phone",l:"Téléphone",v:m.phone,t:"tel"},{k:"parent",l:"Contact parent",v:m.parent,t:"tel"},{k:"address",l:"Quartier",v:m.address},{k:"group",l:"Paroisse / Groupe",v:m.group}];
    if(S.hasGender)fields.splice(1,0,{k:"gender",l:"Sexe",t:"select",o:[["","— Non précisé —"],["M","Garçon"],["F","Fille"]],v:m.gender});
    form2("Modifier les informations",fields,async o=>{
      if(Object.entries(o).some(([k,v])=>k!=="gender"&&!v)){toast("Aucun champ ne peut être vide.");return false;}
      const upd={full_name:o.name,birth_date:o.birth,school:o.school,class_name:o.classe,address:o.address,parish_group:o.group};
      if(S.hasGender)upd.gender=o.gender||null;
      const {error:e1}=await sb.from("member_profiles").update(upd).eq("user_id",m.id);
      if(e1){dbError(e1);return false;}
      const {error:e2}=await sb.from("member_private").update({phone:o.phone,parent_phone:o.parent,neighborhood:o.address}).eq("user_id",m.id);
      if(e2){dbError(e2);return false;}
      await refreshAndRender();toast("Profil mis à jour sur tous les appareils.");
    });
  };
  A.editMember = d => editMember(S.members.find(m=>m.id===d.p));
  A.editMe = () => editMember(me());

  document.addEventListener("change",async e=>{
    const t=e.target,u=me();if(!u)return;
    if(t.id==="l1"||t.id==="l2"){
      const field=t.id==="l1"?"qr_link_1":"qr_link_2",value=cleanUrl(t.value);
      const {error}=await sb.from("member_profiles").update({[field]:value}).eq("user_id",u.id);if(error)dbError(error);else{u[t.id]=value;afterRender();}
    }
    if(t.id==="cardPhoto"&&t.files?.[0]){
      if(t.files[0].size>1500000){toast("Choisissez une photo de moins de 1,5 Mo.");return;}
      const reader=new FileReader();reader.onload=async()=>{const img=new Image();img.onload=async()=>{const scale=Math.min(1,520/Math.max(img.width,img.height)),cv=document.createElement("canvas");cv.width=img.width*scale;cv.height=img.height*scale;cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);const data=cv.toDataURL("image/jpeg",.78);const {error}=await sb.from("member_profiles").update({avatar_url:data}).eq("user_id",u.id);if(error)dbError(error);else{u.photo=data;afterRender();toast("Photo synchronisée.");}};img.src=reader.result;};reader.readAsDataURL(t.files[0]);
    }
  });

  await refreshAndRender();
  subscribeRealtime();
  const urlInfo = location.hash + location.search;
  if (recovery || /type=recovery/.test(urlInfo)) { recovery = true; go("resetPw"); }
  else if (/error_code=otp_expired|error=access_denied/.test(urlInfo)) { go("auth"); toast("Ce lien a expiré ou a déjà été utilisé. Connectez-vous : si votre e-mail n'est pas confirmé, vous pourrez renvoyer le lien ; sinon utilisez « Mot de passe oublié ».", 9000); }
  else if (/type=signup|type=email/.test(urlInfo) && me()) toast("Adresse e-mail confirmée. Bienvenue !", 5000);
  if (urlInfo) history.replaceState(null, "", location.pathname);
  if(me()&&!recovery)voice();
  console.info("TRIBU GBÊ : Supabase connecté, synchronisation temps réel active.");
})().catch(err=>{console.error("Initialisation Supabase impossible",err);toast("Connexion au serveur impossible. Vérifiez votre connexion Internet.",6000);});


/* ===== Bouton Slogan (menu hamburger) ===== */
(() => {
  const SLOGAN = "🌍 LA TERRE EST NOTRE HÉRITAGE COMMUN, PROTÉGEONS-LA POUR LES GÉNÉRATIONS FUTURES ! 🌳💧";
  const BLOCKS = [
    ["h", "🌍 Le sens de notre slogan"],
    ["p", "La Terre n'appartient à personne en particulier : elle nous est confiée à tous 🤝. Forêts 🌳, rivières 💧, sols fertiles 🌱 et air pur 🌬️ sont un héritage commun que nous n'avons pas le droit de gaspiller."],
    ["p", "« Protégeons-la pour les générations futures » nous rappelle que chaque geste d'aujourd'hui prépare le monde de demain 👧🏾👦🏾. Planter un arbre 🌳, économiser l'eau 💧, ne pas jeter ses déchets dans la nature ♻️ : ce sont de petits actes qui, ensemble, changent tout."],
    ["p", "Pour la Tribu Gbê, c'est aussi une promesse scoute ⚜️ : laisser notre village, notre pays et notre planète meilleurs que nous les avons trouvés. C'est notre devise en action : Foi 🙏, Défi 💪, Unité 🤝."],
    ["h", "🎯 Les ODD liés à notre application"],
    ["p", "Les Objectifs de Développement Durable (ODD) des Nations Unies 🇺🇳 sont 17 défis à relever d'ici 2030. Voici ceux qui rejoignent notre mission, aujourd'hui et dans les étapes à venir :"],
    ["o", "4", "#c5192d", "Éducation de qualité 📚 — Espace Formation, rédaction, parcours d'apprentissage."],
    ["o", "5", "#ff3a21", "Égalité entre les sexes 👧🏾👦🏾 — garçons et filles ont la même place dans la Tribu."],
    ["o", "6", "#26bde2", "Eau propre et assainissement 💧 — sensibiliser à protéger nos sources d'eau."],
    ["o", "9", "#fd6925", "Innovation et infrastructure 📱 — une application moderne au service des villages."],
    ["o", "11", "#fd9d24", "Villes et communautés durables 🏘️ — nos villages, nos générations, notre vie en commun."],
    ["o", "13", "#3f7e44", "Lutte contre le changement climatique 🌡️ — agir localement, penser globalement."],
    ["o", "15", "#56c02b", "Vie terrestre 🌳🦋 — protéger forêts, sols et biodiversité."],
    ["o", "16", "#00689d", "Paix, justice et institutions efficaces ⚖️ — confiance, traçabilité et protection des données."],
    ["o", "17", "#19486a", "Partenariats pour les objectifs 🤝 — agir ensemble, villages, chefs et partenaires."],
    ["p", "🌟 Ensemble, faisons de chaque Cheminot un gardien de la Terre !"]
  ];
  let tok = 0, flipped = false;
  const close = () => { tok++; const o = document.getElementById("slg"); if (o) o.remove(); };
  const type = (box, sc, my) => {
    const act = box.querySelector(".sk"); let auto = true;
    sc.parentElement.addEventListener("touchstart", () => auto = false, { passive: true });
    const done = () => { if (act) act.remove(); box.querySelectorAll(".cur").forEach(e => e.classList.remove("cur")); };
    const runBlock = i => {
      if (my !== tok) return;
      if (i >= BLOCKS.length) return done();
      const b = BLOCKS[i];
      let el, txt;
      if (b[0] === "o") {
        el = document.createElement("div"); el.className = "od";
        el.innerHTML = `<b style="background:${b[2]}">ODD ${b[1]}</b><span></span>`; txt = b[3];
        box.insertBefore(el, act); el = el.lastChild;
      } else {
        el = document.createElement(b[0] === "h" ? "h3" : "p"); txt = b[1]; box.insertBefore(el, act);
      }
      const ch = Array.from(txt); let k = 0; el.classList.add("cur");
      const step = () => {
        if (my !== tok) return;
        k = Math.min(ch.length, k + 2); el.textContent = ch.slice(0, k).join("");
        if (auto) sc.parentElement.scrollTop = sc.parentElement.scrollHeight;
        if (k < ch.length) setTimeout(step, 22); else { el.classList.remove("cur"); setTimeout(() => runBlock(i + 1), 160); }
      };
      step();
    };
    box.skip = () => {
      tok++; box.querySelectorAll("h3,p,.od").forEach(e => e.remove());
      BLOCKS.forEach(b => {
        const e = document.createElement(b[0] === "o" ? "div" : b[0] === "h" ? "h3" : "p");
        if (b[0] === "o") { e.className = "od"; e.innerHTML = `<b style="background:${b[2]}">ODD ${b[1]}</b><span></span>`; e.lastChild.textContent = b[3]; }
        else e.textContent = b[1];
        box.insertBefore(e, act);
      }); done();
    };
    runBlock(0);
  };
  A.slogan = () => {
    closeMenu(); close(); flipped = false;
    const o = document.createElement("div"); o.id = "slg";
    o.innerHTML = `<div class="sw"><div class="sc"><div class="fr" data-act="slgFlip"><div style="font-size:2.4rem">🌍🌳💧</div><div class="sl"></div><div class="th">👆 Touchez la carte</div></div></div></div>`;
    o.querySelector(".sl").textContent = SLOGAN;
    document.querySelector(".app").appendChild(o);
    o.addEventListener("click", e => { if (e.target === o) close(); });
    try { snd(660, .1); } catch (e) {}
  };
  A.slgFlip = () => {
    if (flipped) return; flipped = true;
    const sc = document.querySelector("#slg .sc"); if (!sc) return;
    try { snd(520, .08); } catch (e) {}
    sc.classList.add("fl");
    const my = ++tok;
    setTimeout(() => {
      sc.innerHTML = `<div class="bk2"><button class="x sec" data-act="slgClose" aria-label="Fermer">✕</button><button class="sec sk" data-act="slgSkip">⏩ Tout afficher</button></div>`;
      sc.classList.remove("fl");
      type(sc.firstChild, sc, my);
    }, 280);
  };
  A.slgSkip = () => { const b = document.querySelector("#slg .bk2"); if (b && b.skip) b.skip(); };
  A.slgClose = close;
  const prev = openMenu;
  openMenu = function () {
    prev();
    const dp = document.getElementById("dp"); if (!dp) return;
    const btn = `<button class="mi sec" style="--i:${dp.querySelectorAll(".mi").length}" data-act="slogan">🌍 Slogan</button>`;
    const ref = dp.querySelector('[data-act="logout"]') || dp.querySelector('[data-act="contact"]');
    if (ref) ref.insertAdjacentHTML("beforebegin", btn); else dp.insertAdjacentHTML("beforeend", btn);
  };
})();

/* ===== Rôles v2 : Safhouin fondateur / adjoint, Safouin, Cheminot ===== */
(() => {
  const rpc = async (fn, args, okMsg, errMsg) => {
    const { error } = await sb.rpc(fn, args);
    if (error) return dbError(error, errMsg);
    await refreshAndRender(); toast(okMsg, 5000); return true;
  };
  A.promouvoirSafouin = d => confirm("Promouvoir cette personne en Safouin (chef de village) ?") && rpc("tribu_promouvoir_safouin", { p_target: d.p }, "Promu Safouin.", "Promotion impossible.");
  A.retrograderSafouin = d => confirm("Rétrograder ce Safouin en Cheminot simple ?") && rpc("tribu_retrograder_safouin", { p_target: d.p }, "Rétrogradé en Cheminot.", "Rétrogradation impossible.");
  A.supprimerMembre = async d => {
    const m = S.members.find(x => x.id === d.p);
    if (!m || !canDeleteMember(m)) return toast("Action réservée au Safhouin.");
    if (!confirm("⚠️ Supprimer définitivement ce membre ? Cette action est irréversible.")) return;
    if (!confirm("Dernière confirmation : supprimer ce membre et toutes ses données ?")) return;
    if (await rpc("tribu_supprimer_membre", { p_target: d.p }, "Membre supprimé.", "Suppression impossible.")) go("members");
  };
  A.nommerSafhouin = d => isFounder() && confirm("Nommer cette personne Safhouin adjoint ? L'actuel adjoint (s'il existe) redeviendra Safouin.") && rpc("tribu_nommer_safhouin", { p_target: d.p }, "Safhouin adjoint nommé.", "Nomination impossible.");
  A.retrograderSafhouin = d => isFounder() && confirm("Rétrograder ce Safhouin adjoint en Safouin ?") && rpc("tribu_retrograder_safhouin", { p_target: d.p }, "Safhouin rétrogradé.", "Rétrogradation impossible.");
  V.safhouins = () => {
    if (!isFounder()) return V.home();
    const cur = S.members.find(m => m.role === "safhouin" && m.active);
    const chefs = S.members.filter(m => m.role === "safouin" && m.active);
    return `<h2>Safhouins</h2>
      ${cur ? `<div class="card"><h3>👑 Safhouin adjoint actuel</h3><p><strong>${esc(cur.name)}</strong></p><p>${vb(cur)}</p>
        <button class="dg" data-act="retrograderSafhouin" data-p="${cur.id}">⬇️ Rétrograder en Safouin</button></div>` : `<div class="card"><p>Aucun Safhouin adjoint nommé.</p></div>`}
      <div class="card"><h3>Nommer un Safhouin adjoint</h3><p>L'adjoint voit tout mais ne peut pas nommer d'autre Safhouin.</p>
        ${chefs.map(m => `<div class="item row" style="cursor:default"><span><strong>${esc(displayName(m))}</strong> ${vb(m)}</span>
          <button style="width:auto;margin:0;padding:8px 12px" data-act="nommerSafhouin" data-p="${m.id}">👑 Nommer</button></div>`).join("") || "<p>Aucun Safouin disponible.</p>"}
      </div>${backBtn()}`;
  };
  const prev = openMenu;
  openMenu = function () {
    prev();
    if (!isFounder()) return;
    const dp = document.getElementById("dp"), ref = dp.querySelector('[data-act="logout"]');
    const b = `<button class="mi sec" style="--i:${dp.querySelectorAll(".mi").length}" data-act="go" data-t="safhouins">👑 Safhouins</button>`;
    if (ref) ref.insertAdjacentHTML("beforebegin", b);
  };
})();
</script>
